name: Update recent GitHub stars
on:
  schedule:
    - cron: '23 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-starred
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/sync-starred.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm check && pnpm test && pnpm build
      - name: Save refreshed public list
        run: |
          if git diff --quiet -- content/starred.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/starred.json
          git commit -m 'Refresh recent public GitHub stars'
          git push origin HEAD:main
